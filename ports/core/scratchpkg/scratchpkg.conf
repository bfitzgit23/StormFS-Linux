#
# /etc/scratchpkg.conf : StormFS Linux build configuration for scratchpkg
#
# This file is sourced by pkgbuild before a port's spkgbuild.  It carries the
# build policy the former /etc/pkgmk.conf provided, adapted to scratchpkg:
# no systemd integration, X.Org built --disable-static, and non-/usr Qt6/KF6
# prefixes on the search paths.
#

export CFLAGS="-O2 -march=x86-64 -pipe"
export CXXFLAGS="${CFLAGS}"
export FCFLAGS="${CFLAGS}"
export FFLAGS="${CFLAGS}"
export CPPFLAGS="-I/usr/include"
export LDFLAGS="-Wl,-O1 -Wl,--as-needed -Wl,-z,pack-relative-relocs -L/usr/lib -Wl,-rpath-link,/usr/lib"
export LIBRARY_PATH="/usr/lib"

export PKG_CONFIG_PATH="/usr/lib/pkgconfig:/usr/share/pkgconfig"
export PKG_CONFIG_LIBDIR="/usr/lib/pkgconfig:/usr/share/pkgconfig"

# X.Org ports call ./configure $XORG_CONFIG, exactly as they did under pkgmk.
export XORG_PREFIX="/usr"
export XORG_CONFIG="--prefix=/usr --sysconfdir=/etc --localstatedir=/var --disable-static"

# Parallelism. The bootstrap overrides JOBS/MAKEFLAGS through its own config.
JOBS="${JOBS:-$(nproc)}"
export JOBS
export MAKEFLAGS="-j ${JOBS}"

# Non-/usr Qt6/KF6 prefixes installed by the plasma collection.
if [ -d /opt/qt6 ]; then
	export QT6DIR="/opt/qt6"
	export CMAKE_PREFIX_PATH="/opt/qt6${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}"
	export PKG_CONFIG_PATH="/opt/qt6/lib/pkgconfig:$PKG_CONFIG_PATH"
fi
if [ -d /opt/kf6 ]; then
	export KF6_PREFIX="/opt/kf6"
	export CMAKE_PREFIX_PATH="/opt/kf6${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}"
	export PKG_CONFIG_PATH="/opt/kf6/lib/pkgconfig:$PKG_CONFIG_PATH"
fi

# ccache, when the port is installed. Never point at the build host's wrappers
# during a bootstrap; the bootstrap sets BFS_CCACHE=no for that case.
if [ "${BFS_CCACHE:-yes}" = yes ] && [ -x /usr/bin/ccache ] && [ -x /usr/lib/ccache/gcc ]; then
	export CCACHE_DIR="/var/cache/ccache"
	export PATH="/usr/lib/ccache:$PATH"
fi

# Caches and work trees.
# SOURCE_DIR="/var/cache/scratchpkg/sources"
# PACKAGE_DIR="/var/cache/scratchpkg/packages"
# WORK_DIR="/var/cache/scratchpkg/work"
# CBUILD_DIR="/var/lib/scratchpkg/cbuild"

# Package policy: keep the release archive lean like the previous tree did.
COMPRESSION_MODE="xz"
NO_STRIP="no"
KEEP_DOC="no"
KEEP_LOCALE="no"
KEEP_LIBTOOL="no"
