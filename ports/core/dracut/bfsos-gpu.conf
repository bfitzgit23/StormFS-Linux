# BFSOS hybrid GPU policy for Dracut.
# Keep Raptor Lake iGPU and NVIDIA offload stack in every initramfs,
# including host-only images and later manual/kernel-package rebuilds.
# generate-config.sh can inherit a non-hybrid host config; this forces
# the laptop's DRM drivers into the image so GuC/HuC/DMC firmware loads
# and the dGPU enumerates for PRIME.
#
# Firmware blobs themselves come from linux-firmware (i915/xe) and
# nvidia (GSP) ports; dracut's 90kernel-modules installs the firmware
# for each forced driver automatically. Modules that are not present
# (e.g. proprietary nvidia before install) are ignored — no failure.
force_drivers+=" i915 xe nouveau "
force_drivers+=" nvidia nvidia_modeset nvidia_uvm nvidia_drm "
