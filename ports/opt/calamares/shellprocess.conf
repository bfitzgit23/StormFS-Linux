---
dontChroot: false
timeout: 300
script:
    - "-scratch remove -y calamares"
    - "-rm -rf /etc/calamares /usr/bin/calamares /usr/lib/calamares /usr/share/calamares"
    - "-rm -f /usr/share/applications/calamares.desktop /usr/share/pixmaps/stormfs-logo.png"
    - "-rm -f /etc/sudoers.d/90-bfs-live"
    - "-userdel -r bfs"
    - "-rm -rf /home/bfs"
    - "-groupdel bfs"
    - "-rm -f /usr/local/sbin/bfs-live-console-font /usr/local/sbin/bfs-live-init /usr/local/sbin/bfs-live-menu"
    - "-rm -f /etc/init.d/bfs-live-init /etc/runlevels/default/bfs-live-init"
    - "-sed -i -E 's|^.*--autologin bfs.*$|tty1::respawn:/sbin/agetty --noclear tty1 38400 linux|' /etc/inittab"
