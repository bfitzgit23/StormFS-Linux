# nvidia-hybrid-blacklist.conf — hybrid GPU policy for the proprietary NVIDIA driver
#
# On hybrid laptops (Intel iGPU or AMD APU plus an NVIDIA dGPU), the
# integrated GPU's DRM driver binds first and the NVIDIA GPU becomes an
# offload device (PRIME). To make the NVIDIA GPU the only display adapter,
# uncomment the block matching the integrated hardware, then rebuild the
# initramfs and reboot:
#
#   dracut --force --regenerate-all
#
# The "install <module> /bin/false" form is a hard block: even an explicit
# modprobe fails. This is required on StormFS because the BFSOS initramfs
# force-loads i915 and xe (ports/core/dracut/bfsos-gpu.conf); a plain
# "blacklist" line only stops automatic alias-based loading and would be
# overridden by the initramfs.
#
# Intel iGPU (Raptor Lake and similar; both drivers may be present):
#install i915 /bin/false
#install xe /bin/false
#
# AMD APU (Ryzen hybrid laptops):
#install amdgpu /bin/false
#
# Soft alternative (blocks automatic loading only; useful for a quick test
# from the GRUB command line via modprobe.blacklist=i915,xe):
#blacklist i915
#blacklist xe
#blacklist amdgpu
#
# The nouveau open kernel driver must never bind when the proprietary
# driver is installed; hard-block it unconditionally:
install nouveau /bin/false
