[base]
## BFSOS/StormFS defaults.  Autologin is intentionally not enabled.
greeter=/usr/lib/lxdm/lxdm-greeter-gtk
session=/usr/bin/startxfce4

[server]
## Use the default X server arguments.

[display]
## GTK2 widget theme and StormFS greeter theme.
gtk_theme=Clearlooks
bg=/usr/share/lxdm/themes/StormFS/background.jpg
bottom_pane=1
lang=1
keyboard=0
theme=StormFS

[userlist]
disable=0
